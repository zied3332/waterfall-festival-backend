name: Diagnose cPanel Quotas

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout diagnostic code
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup runner Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate read-only diagnostic tooling
        run: |
          bash -n scripts/deploy/cpanel-quota-diagnose.sh
          node --check scripts/deploy/cpanel-quota-output.mjs
          node --test tests/cpanel-quota-workflow.test.mjs
      - name: Diagnose cPanel quotas over existing SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
        run: bash scripts/deploy/cpanel-quota-diagnose.sh
