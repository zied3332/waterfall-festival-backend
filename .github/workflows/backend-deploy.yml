name: Deploy Backend

on:
  workflow_run:
    workflows: [Backend CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: backend-production
  cancel-in-progress: false

jobs:
  eligibility:
    runs-on: ubuntu-latest
    outputs:
      allowed: ${{ steps.gate.outputs.allowed }}
    steps:
      - name: Require explicit deployment or qualifying successful push CI
        id: gate
        uses: actions/github-script@v7
        with:
          script: |
            let allowed = context.eventName === 'workflow_dispatch' && context.ref === 'refs/heads/main';
            const run = context.payload.workflow_run;
            if (context.eventName === 'workflow_run' && run?.conclusion === 'success' &&
                run.event === 'push' && run.head_branch === 'main' &&
                run.head_repository?.full_name === `${context.repo.owner}/${context.repo.repo}`) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {
                ...context.repo, run_id: run.id, filter: 'latest', per_page: 100
              });
              allowed = jobs.some(job => job.name === 'Application changes qualify for deployment' && job.conclusion === 'success');
            }
            core.setOutput('allowed', String(allowed));
            core.info(allowed ? 'Deployment eligible.' : 'Deployment skipped: no qualifying application changes.');

  deploy:
    needs: eligibility
    if: needs.eligibility.outputs.allowed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.sha || github.event.workflow_run.head_sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database
        run: npm ci
      - name: Validate deployment tooling
        run: node --test tests/backend-deploy.test.mjs tests/cpanel-upload.test.mjs
      - name: Build backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database
        run: npm run build
      - name: Package only application code
        run: |
          set -euo pipefail
          node scripts/deploy/backend-deploy.mjs --package "$RUNNER_TEMP/backend.tar.gz" > "$RUNNER_TEMP/package.json"
          node --input-type=module -e '
            import fs from "node:fs";
            const sizes = JSON.parse(fs.readFileSync(process.argv[1]));
            for (const [key, value] of Object.entries(sizes)) {
              if (!Number.isSafeInteger(value) || value < 1) throw Error("Invalid package size");
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
            }
          ' "$RUNNER_TEMP/package.json"
      - name: Preflight, back up, stage and deploy through existing cPanel SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
          PRODUCTION_DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          BACKEND_BACKUP_KEEP: ${{ vars.BACKEND_BACKUP_KEEP || '5' }}
          BACKEND_DEPLOY_RESERVE_MB: ${{ vars.BACKEND_DEPLOY_RESERVE_MB || '1024' }}
          BACKEND_DEPLOY_RESERVE_INODES: ${{ vars.BACKEND_DEPLOY_RESERVE_INODES || '50000' }}
        run: bash scripts/deploy/cpanel-deploy.sh
