name: Deploy Backend

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database
        run: npm ci

      - name: Build backend
        env:
          DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database
        run: npm run build

      - name: Package backend
        run: |
          tar \
            --exclude='./node_modules' \
            --exclude='./.git' \
            --exclude='./.env' \
            -czf "$RUNNER_TEMP/backend.tar.gz" \
            .

      - name: Deploy to cPanel
        env:
          SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.CPANEL_SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.CPANEL_HOST }}
          SSH_USER: ${{ secrets.CPANEL_USERNAME }}
          SSH_PORT: ${{ secrets.CPANEL_PORT }}
        run: |
          set -e

          mkdir -p ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

          eval "$(ssh-agent -s)"

          cat > "$RUNNER_TEMP/askpass.sh" <<'EOF'
          #!/bin/sh
          printf '%s\n' "$SSH_PASSPHRASE"
          EOF

          chmod +x "$RUNNER_TEMP/askpass.sh"

          export SSH_ASKPASS="$RUNNER_TEMP/askpass.sh"
          export SSH_ASKPASS_REQUIRE=force

          setsid ssh-add ~/.ssh/deploy_key < /dev/null

          echo "Uploading backend package..."

          scp \
            -P "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$RUNNER_TEMP/backend.tar.gz" \
            "$SSH_USER@$SSH_HOST:~/waterfall-backend-deploy.tar.gz"

          echo "Connecting to production server..."

          ssh \
            -p "$SSH_PORT" \
            -o StrictHostKeyChecking=accept-new \
            "$SSH_USER@$SSH_HOST" \
            'bash -s' <<'REMOTE_SCRIPT'

          set -e

          APP="$HOME/waterfall-backend"
          NODE_ENV_DIR="$HOME/nodevenv/waterfall-backend/22"

          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BACKUP="$HOME/waterfall-backups/backend-$TIMESTAMP"

          CI_DATABASE_URL="postgresql://ci_user:ci_password@localhost:5432/ci_database"

          echo "==================================="
          echo "Activating cPanel Node.js environment"
          echo "==================================="

          if [ -f "$NODE_ENV_DIR/bin/activate" ]; then
            source "$NODE_ENV_DIR/bin/activate"
          else
            echo "Expected Node environment not found:"
            echo "$NODE_ENV_DIR/bin/activate"

            echo "Available Node environments:"
            find "$HOME/nodevenv" \
              -maxdepth 4 \
              -type f \
              -name activate \
              2>/dev/null || true

            exit 1
          fi

          echo "Node:"
          which node
          node --version

          echo "NPM:"
          which npm
          npm --version

          echo "==================================="
          echo "Creating backend backup"
          echo "==================================="

          mkdir -p "$BACKUP"

          if [ -d "$APP" ]; then
            cp -a "$APP/." "$BACKUP/"
          fi

          echo "Backup created:"
          echo "$BACKUP"

          echo "==================================="
          echo "Deploying backend files"
          echo "==================================="

          mkdir -p "$APP"

          tar \
            -xzf "$HOME/waterfall-backend-deploy.tar.gz" \
            -C "$APP"

          rm -f "$HOME/waterfall-backend-deploy.tar.gz"

          cd "$APP"

          echo "==================================="
          echo "Installing dependencies"
          echo "==================================="

          DATABASE_URL="$CI_DATABASE_URL" npm ci --include=dev

          echo "==================================="
          echo "Generating Prisma Client"
          echo "==================================="

          DATABASE_URL="$CI_DATABASE_URL" npx prisma generate

          echo "==================================="
          echo "Building NestJS backend"
          echo "==================================="

          DATABASE_URL="$CI_DATABASE_URL" npm run build

          echo "==================================="
          echo "Checking production build"
          echo "==================================="

          if [ ! -f "$APP/dist/src/main.js" ]; then
            echo "ERROR: dist/src/main.js does not exist."
            exit 1
          fi

          echo "Build verified:"
          ls -lh "$APP/dist/src/main.js"

          echo "==================================="
          echo "Restarting cPanel Node application"
          echo "==================================="

          mkdir -p "$APP/tmp"
          touch "$APP/tmp/restart.txt"

          echo "==================================="
          echo "Backend deployment completed"
          echo "==================================="

          echo "Application: $APP"
          echo "Backup: $BACKUP"

          REMOTE_SCRIPT

      - name: Wait for backend restart
        run: sleep 10

      - name: Verify production API
        run: |
          echo "Checking Waterfall Festival API..."

          RESPONSE=$(curl \
            --fail \
            --silent \
            --show-error \
            --location \
            https://api.waterfallpartykohphangan.com/)

          echo "$RESPONSE"

          echo "$RESPONSE" | grep -q '"status":"running"'

          echo "Production API is running successfully."