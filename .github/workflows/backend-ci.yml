name: Backend CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      # Dummy CI-only URL.
      # Prisma needs DATABASE_URL while loading prisma.config.ts.
      # This does NOT connect to the production database.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Build backend
        run: npm run build