name: Backend CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      application: ${{ steps.scope.outputs.application }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Classify the complete pushed range
        id: scope
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: node scripts/deploy/deployment-scope.mjs

  deployment-eligible:
    name: Application changes qualify for deployment
    needs: changes
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.changes.outputs.application == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Application changes qualify; successful Backend CI is still required.'

  build:
    name: Lint, Test and Build
    runs-on: ubuntu-latest

    env:
      # Dummy CI-only URL.
      # Prisma needs DATABASE_URL while loading prisma.config.ts.
      # This does NOT connect to the production database.
      DATABASE_URL: postgresql://ci_user:ci_password@localhost:5432/ci_database

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run static analysis
        run: npm run lint:check

      - name: Validate deployment scripts
        run: |
          bash -n scripts/deploy/cpanel-deploy.sh
          node --check scripts/deploy/backend-deploy.mjs
          node --test tests/backend-deploy.test.mjs tests/cpanel-upload.test.mjs tests/deployment-scope.test.mjs tests/inode-inventory.test.mjs

      - name: Run unit tests
        run: npm test -- --runInBand

      - name: Build backend
        run: npm run build
